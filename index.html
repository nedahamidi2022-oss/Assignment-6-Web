<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Party Assignment - jQuery</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="app-container">
        <header>
            <h1>The Party House: 19:30 - 22:30</h1>
            <button id="clear-btn">Clear Spotlight</button>
        </header>

        <div id="house"></div>

        <div id="cases-section">
            <h3>🔍 Selector Detective Cases (Tasks 1 & 2)</h3>
            <div id="cases-container"></div>
        </div>
    </div>

    <div id="card-modal" style="display:none;">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <div id="modal-details"></div>
            <div id="move-buttons"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
